<!DOCTYPE html><head>
<title>Lighthouse - LittleJS</title>
<meta charset=utf-8>
</head><body style=background:#000>
<!-- LittleJS (a copy of the release build this demo was made with) -->
<script src=littlejs.js></script>
<script>
'use strict';

///////////////////////////////////////////////////////////////////////////////
// Lighthouse: a lighthouse on a rocky islet in a blue hour storm. The sea heaves, rain streaks through the turning
// beam, and lightning lights the clouds, the swells and the rocks from where it strikes. Click to call a strike.

// ?cinematic: a hands free 30 second shot for video - title, five strikes, the camera's drift, end card
const cinematic = location.search.includes('cinematic');
const CINE_LENGTH = 30, CINE_END_CARD = 25.5;

let hudVisible = true, slowMo = false, titleStart = -1e9, fpsSmooth = 60, lastFrameTime = 0, freeCam = false;
// the storm's own clock: everything that should slow down in slow motion reads it instead of the engine's time
let stormTime = 0, stormSeed = 1;

///////////////////////////////////////////////////////////////////////////////
// CAMERA BEGIN - the cinematic path, plain math only so node can test it
//
// The camera rides low over the swells, a few meters up, and drifts round the island along the shot's legs: hold,
// dolly in, swing left round it, pull back and up, hold for the end card, then ease back to the start so the live
// page loops. Positions are interpolated round the island (radius and angle, not straight lines), so the swing keeps
// its distance instead of cutting the corner.

const EYE_MIN = 3;         // never lower than this, or a swell crest would swallow the lens
const CAM_LOOP = 38;       // the live page's loop, the cinematic's 30 seconds plus the ease home
const CAM_LEGS = [
    {t: 0,    pos: [0, 5, 76],     target: [0, 12, 0]},
    {t: 3.5,  pos: [0, 5, 76],     target: [0, 12, 0]},
    {t: 11,   pos: [0, 6, 54],     target: [0, 12, 0]},
    {t: 18.5, pos: [-26, 9, 44],   target: [2, 12, 0]},
    {t: 25.5, pos: [-14, 13, 66],  target: [0, 12, 0]},
    {t: 34,   pos: [-14, 13, 66],  target: [0, 12, 0]},
    {t: CAM_LOOP, pos: [0, 5, 76], target: [0, 12, 0]},
];

function cameraPathAt(t)
{
    let k = 1;
    while (k < CAM_LEGS.length - 1 && CAM_LEGS[k].t < t) ++k;
    const a = CAM_LEGS[k-1], b = CAM_LEGS[k];
    let p = Math.min(Math.max((t - a.t)/(b.t - a.t), 0), 1);
    p = p*p*(3 - 2*p);
    const ra = Math.hypot(a.pos[0], a.pos[2]), rb = Math.hypot(b.pos[0], b.pos[2]);
    const aa = Math.atan2(a.pos[0], a.pos[2]), ab = Math.atan2(b.pos[0], b.pos[2]);
    const r = ra + (rb - ra)*p, angle = aa + (ab - aa)*p;
    const y = Math.max(EYE_MIN, a.pos[1] + (b.pos[1] - a.pos[1])*p);
    const mix = i => a.target[i] + (b.target[i] - a.target[i])*p;
    return {pos: vec3(r*Math.sin(angle), y, r*Math.cos(angle)), target: vec3(mix(0), mix(1), mix(2))};
}
// CAMERA END

///////////////////////////////////////////////////////////////////////////////
// ISLAND BEGIN - the islet's shape, plain math only so node can test it
//
// One piece of rock, a height for every place: level on the crown where the tower stands and on the pad beside it
// for the cottage, then down to the sea in broken ledges, with outcrops standing up out of the slope and a shoreline
// that wanders in and out. Round it a few skerries break the surface, awash when a swell goes over them. Outside all
// of it the rock is sunk well under the troughs, so nothing ever shows an edge or floats.

const ISLAND_SIZE = 64;     // meters across the island's mesh
const SHELF_Y = 6;          // the crown the tower stands on, well clear of the swells
const CROWN_RADIUS = 5.2;   // the level ground round the tower's foot
const PAD = {x: 5, z: -3, r: 4.1};      // and the level ground under the cottage
const SHORE_BASE = 14, SHORE_WAVES = [[2.2, 2, .7], [1.4, 3, 2.1], [.8, 5, 4]]; // amplitude, turns, phase
const SKERRIES = [
    {x: -20,  z: 9,   r: 4.2, h: 4.4, turn: .5},
    {x: 18,   z: 14,  r: 3.4, h: 2.8, turn: 2.2},
    {x: -11,  z: -21, r: 4.6, h: 5.5, turn: 1.2},
    {x: 22.5, z: -8,  r: 3,   h: 2.2, turn: .2},
    {x: 3,    z: 22,  r: 2.6, h: 1.8, turn: 2.8},
    {x: -17,  z: 15,  r: 2.2, h: 1.5, turn: 1.7},
];

// smooth noise, 0 to 1, the same for the same place every run
function islandNoise(x, z)
{
    const hash = (i, j) =>
    {
        let h = Math.imul(i, 374761393) + Math.imul(j, 668265263) | 0;
        h = Math.imul(h ^ (h >>> 13), 1274126177);
        return ((h ^ (h >>> 16)) >>> 0)/4294967296;
    };
    const i = Math.floor(x), j = Math.floor(z);
    let fx = x - i, fz = z - j;
    fx = fx*fx*(3 - 2*fx), fz = fz*fz*(3 - 2*fz);
    const a = hash(i, j), b = hash(i + 1, j), c = hash(i, j + 1), d = hash(i + 1, j + 1);
    return a + (b - a)*fx + (c - a)*fz + (a - b - c + d)*fx*fz;
}

// how far out the waterline is, looking out from the middle at an angle (0 toward +z, as atan2(x, z))
function islandShore(angle)
{
    let r = SHORE_BASE;
    for (const [amp, turns, phase] of SHORE_WAVES) r += amp*Math.sin(turns*angle + phase);
    return r;
}

function islandHeightAt(x, z)
{
    const unit = v => Math.min(Math.max(v, 0), 1);
    // ledges: a height pulled toward steps down from the crown, flat for most of each and steep between
    const ledges = (h, step) =>
    {
        const k = (h - SHELF_Y)/step, f = k - Math.floor(k), rise = unit((f - .55)/.45);
        return SHELF_Y + (Math.floor(k) + rise*rise*(3 - 2*rise))*step;
    };
    const r = Math.hypot(x, z), shore = islandShore(Math.atan2(x, z));
    // how far outside the level ground this is, and how far that is of the way to the waterline
    const out = Math.max(0, Math.min(r - CROWN_RADIUS, Math.hypot(x - PAD.x, z - PAD.z) - PAD.r));
    const t = out/Math.max(2.5, shore - (r - out)), rough = unit(out/1.5);
    let y = t < 1 ? SHELF_Y*(1 - t**1.4) : -(t - 1)*9;
    y += (islandNoise(x*.3, z*.3) - .5)*1.6*rough;
    y = ledges(y, 1.3) + (islandNoise(x*1.1 + 7, z*1.1) - .5)*.6*rough;
    // outcrops standing up out of the slope, none on the level ground or out past the shore
    y += Math.max(0, islandNoise(x*.45 + 31, z*.45 + 17) - .58)*9*unit((out - 1)/2.5)*unit((1.25 - t)/.3);
    for (const k of SKERRIES)
    {
        // a long jagged tooth of rock: narrow across its length, steep sided, its crest broken into ridges and
        // notches by the noise so no two faces match
        const c = Math.cos(k.turn), s = Math.sin(k.turn), dx = x - k.x, dz = z - k.z;
        const d = Math.hypot(dx*c + dz*s, (dz*c - dx*s)*1.9)/k.r;
        if (d > 1.7) continue;
        const ridge = 1 - Math.abs(2*islandNoise(x*.7 + 50, z*.7) - 1), chip = islandNoise(x*1.9 + 9, z*1.9);
        let h = d < 1 ? k.h*(1 - d**1.3)*(.45 + .85*ridge) + (chip - .5)*.7*unit(d*3) : -(d - 1)*8;
        d < .25 && (h = Math.max(h, k.h*.6)); // its middle always stands clear of the water
        y = Math.max(y, ledges(h + .2, .45));
    }
    return Math.max(y, -6);
}

// where the swells break on the rock: points on the waterline on the side the wind comes from, the island's own
// shore and the upwind faces of the skerries
function islandSprayPoints(windX, windZ)
{
    const points = [], upwind = Math.atan2(-windX, -windZ);
    const land = (x, z, dx, dz) =>
    {
        // out from inside the rock, against the wind, to where it goes under
        let d = 0;
        while (d < 20 && islandHeightAt(x + dx*d, z + dz*d) > .3) d += .1;
        points.push({x: x + dx*d, z: z + dz*d});
    };
    for (const turn of [-1, -.5, 0, .5, 1])
    {
        const a = upwind + turn, r = islandShore(a)*.6;
        land(Math.sin(a)*r, Math.cos(a)*r, Math.sin(a), Math.cos(a));
    }
    for (const k of SKERRIES)
        if (k.x*windX + k.z*windZ < 0) land(k.x, k.z, -windX, -windZ);
    return points;
}
// ISLAND END

///////////////////////////////////////////////////////////////////////////////
// SEA BEGIN - the waves, plain math only so node can test it
//
// A handful of long swells running roughly down the wind, Gerstner style: each lifts the water in a sine and pulls it
// toward its crests, so the crests come sharp and the troughs broad. The shader below moves the vertices by the same
// sum; seaHeightAt is its twin for the spray on the rocks, read with the engine's time as the shader's iTime is.

const WIND_DIR = [.29, -.96];     // where the wind blows toward, along x and z
const WAVES = [
    {angle:  .00, length: 38, amp: 1.1, steep: .55, phase: 0},
    {angle:  .45, length: 23, amp: .55, steep: .6,  phase: 2.3},
    {angle: -.38, length: 14, amp: .3,  steep: .7,  phase: 4.1},
    {angle:  .2,  length: 7,  amp: .1,  steep: .5,  phase: 1.7}, // in the normals only, the grid is too coarse for it
];
for (const w of WAVES)
{
    const c = Math.cos(w.angle), s = Math.sin(w.angle);
    w.dir = [WIND_DIR[0]*c - WIND_DIR[1]*s, WIND_DIR[0]*s + WIND_DIR[1]*c];
    w.k = 2*Math.PI/w.length;
    w.speed = Math.sqrt(9.8/w.k); // deep water: longer swells travel faster
}
const SEA_DISPLACED = 3; // the first three move the grid

function seaHeightAt(x, z, t)
{
    let y = 0;
    for (let i = 0; i < SEA_DISPLACED; ++i)
    {
        const w = WAVES[i];
        y += w.amp*Math.sin(w.k*(w.dir[0]*x + w.dir[1]*z) - w.k*w.speed*t + w.phase);
    }
    return y;
}
// SEA END

const SEA_SIZE = 1000, SEA_SEGMENTS = 320;  // meters across and cells a side, about 3m a cell
const SEA_COLOR = rgb(.06,.19,.28), FOAM_COLOR = rgb(.88,.92,.95);
const FOG_START = 90, FOG_END = 380, FOG_COLOR = rgb(.17,.18,.36);
const SUN_AZIMUTH = -.6;                    // where the last of the light is, left of the first shot's view
const AMBIENT_COLOR = rgb(.30,.34,.55), AMBIENT_FLASH = rgb(.22,.25,.42);
let sea;

// the waves as GLSL constants, written from WAVES so the shader and seaHeightAt can never drift apart
const glslWaves = WAVES.map(w => `vec4(${w.dir[0].toFixed(4)},${w.dir[1].toFixed(4)},${w.k.toFixed(4)},${(w.k*w.speed).toFixed(4)})`).join(',');
const glslWaveShape = WAVES.map(w => `vec3(${w.amp.toFixed(4)},${(w.steep/(w.k*w.amp*WAVES.length)).toFixed(4)},${w.phase.toFixed(4)})`).join(',');
// the chop: short waves fanned round the wind, too small for the grid, that only tilt the light. Direction, wavenumber
// and angular speed for each, as the swells have
const CHOP = [[5.5, -.9], [3.6, .7], [2.4, -.3], [1.6, 1.2], [1.1, -1.4], [.75, .3], [.5, -.6]].map(([length, angle]) =>
{
    const c = Math.cos(angle), s = Math.sin(angle), k = 2*Math.PI/length;
    return [WIND_DIR[0]*c - WIND_DIR[1]*s, WIND_DIR[0]*s + WIND_DIR[1]*c, k, Math.sqrt(9.8*k)];
});
const glslChop = CHOP.map(w => `vec4(${w.map(v => v.toFixed(4)).join(',')})`).join(',');
const glslVec3 = c => `vec3(${c.r.toFixed(4)},${c.g.toFixed(4)},${c.b.toFixed(4)})`;
const SEA_GLSL_COMMON = `
const vec4 WAVE[${WAVES.length}] = vec4[](${glslWaves});   // direction, wavenumber, angular speed
const vec3 SHAPE[${WAVES.length}] = vec3[](${glslWaveShape}); // amplitude, Gerstner pull, phase
const vec4 CHOP[${CHOP.length}] = vec4[](${glslChop});
float seaHash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7)))*43758.5453); }
float seaNoise(vec2 p)
{
    vec2 i = floor(p), f = fract(p);
    f = f*f*(3. - 2.*f);
    return mix(mix(seaHash(i), seaHash(i + vec2(1, 0)), f.x), mix(seaHash(i + vec2(0, 1)), seaHash(i + vec2(1)), f.x), f.y);
}
// the slope of waves first to last at a point, x and z
vec2 seaSlope(vec2 p, int first, int last)
{
    vec2 s = vec2(0);
    for (int i = first; i < last; ++i)
    {
        float a = WAVE[i].z*dot(WAVE[i].xy, p) - WAVE[i].w*iTime + SHAPE[i].z;
        s += WAVE[i].xy*(SHAPE[i].x*WAVE[i].z*cos(a));
    }
    return s;
}`;

const SEA_SHADER = new Shader(`${SEA_GLSL_COMMON}
const vec3 SEA = ${glslVec3(SEA_COLOR)}, FOAM = ${glslVec3(FOAM_COLOR)};
const vec2 WIND = vec2(${WIND_DIR[0].toFixed(4)}, ${WIND_DIR[1].toFixed(4)});
const float CREST = ${(WAVES.slice(0, SEA_DISPLACED).reduce((s, w) => s + w.amp, 0)).toFixed(4)};
void mainImage(out vec4 c, vec2 uv)
{
    // foam: streaks along the highest crests, and a churned ring round the rocks, both broken up by noise
    vec2 p = worldPos.xz;
    float n = seaNoise(p*.35 + vec2(iTime*.3, 0.))*.6 + seaNoise(p*1.3 - vec2(0., iTime*.5))*.4;
    float crest = smoothstep(.42*CREST, .85*CREST, worldPos.y + (n - .5)*.5);
    float shore = ${SHORE_BASE.toFixed(2)}${SHORE_WAVES.map(([amp, turns, phase]) => ` + ${amp.toFixed(2)}*sin(${turns.toFixed(1)}*atan(p.x, p.y) + ${phase.toFixed(2)})`).join('')};
    // round the rocks the water is churned white, further out when a swell is in and drawn back when it is out
    float surge = .25*worldPos.y/CREST, land = length(p)/shore;
    float ring = smoothstep(1.75 + surge, 1.05, land + (n - .5)*.5);
    float shallow = smoothstep(2.1, 1., land);
${SKERRIES.map(k => `    ring = max(ring, smoothstep(2.3, 1.2, length(p - vec2(${k.x.toFixed(1)}, ${k.z.toFixed(1)}))/${k.r.toFixed(1)} + (n - .5)*.7));`).join('\n')}
    float foam = clamp(max(crest*smoothstep(.35, .7, n), ring*smoothstep(.2, .55, n + ring*.4)), 0., 1.);
    // foam is lace, not paint: holes open in it along the lines of a finer noise
    float lace = abs(seaNoise(p*1.7 + vec2(iTime*.2, iTime*.1)) - .5)*2.;
    foam *= mix(.35, 1., smoothstep(.05, .3, lace + foam*.25));
    // the troughs deep, the crests lit through with a little green as a wave's thin top is
    float h = clamp((worldPos.y + CREST)/(2.*CREST), 0., 1.);
    vec3 body = mix(vec3(.7,.74,.88), vec3(1.2,1.45,1.3), h*h);
    body = mix(body, vec3(1.15,1.75,1.5), shallow*.45); // paler and greener over the rock shelf
    c = vec4(mix(body, FOAM/SEA, foam), 1);
}
void mainNormal(inout vec3 n)
{
    // the short swell the grid can't carry, then the chop. Each small wave is only drawn where the picture can show
    // it: seen at a shallow angle a ripple is many pixels wide and less than one tall, and drawn anyway it breaks
    // up into flat flickering dashes. So each fades out as it nears the size of a pixel across the water, measured
    // the worse way, up the screen. A slow noise slides their phases about so they never line up into a pattern
    vec2 p = worldPos.xz, s = seaSlope(p, ${SEA_DISPLACED}, ${WAVES.length});
    float pixel = max(length(dFdx(p)), length(dFdy(p))), warp = seaNoise(p*.06 + iTime*.02)*6.283;
    for (int i = 0; i < ${CHOP.length}; ++i)
    {
        float a = CHOP[i].z*dot(CHOP[i].xy, p) - CHOP[i].w*iTime + warp*(1. + float(i)*.6);
        s += CHOP[i].xy*(.085*cos(a)*clamp(1.2/(CHOP[i].z*pixel) - 1., 0., 1.));
    }
    // the rain: the water right under the lens stippled with drops, new ones every few frames
    float t = floor(iTime*15.);
    s += clamp(.03/pixel - 1., 0., 1.)*.25*(vec2(seaNoise(p*8. + t*13.7), seaNoise(p.yx*8. + t*5.3 + 40.)) - .5);
    n = normalize(n + vec3(-s.x, 0., -s.y));
}`, `${SEA_GLSL_COMMON}
void mainVertex(inout vec3 pos, inout vec3 normal)
{
    vec2 p = pos.xz;
    vec3 moved = pos;
    for (int i = 0; i < ${SEA_DISPLACED}; ++i)
    {
        float a = WAVE[i].z*dot(WAVE[i].xy, p) - WAVE[i].w*iTime + SHAPE[i].z;
        moved.y += SHAPE[i].x*sin(a);
        moved.xz += WAVE[i].xy*(SHAPE[i].y*SHAPE[i].x*cos(a)); // pulled toward the crest
    }
    vec2 s = seaSlope(p, 0, ${SEA_DISPLACED});
    pos = moved;
    normal = normalize(vec3(-s.x, 1., -s.y));
}`);

// the sky's color one way: deep blue overhead, the last warm light in a band low toward SUN_AZIMUTH, and the fog's
// own color right at the horizon so the far sea melts into it with no seam
function stormSkyColor(azimuth, elevation)
{
    const deg = elevation*180/PI;
    const zenith = rgb(.10,.15,.36), upper = rgb(.22,.22,.48), low = rgb(.24,.22,.45);
    let c = deg > 25 ? upper.lerp(zenith, Math.min(1, (deg - 25)/45)) : low.lerp(upper, Math.max(0, deg)/25);
    let da = azimuth - SUN_AZIMUTH;
    da = Math.atan2(Math.sin(da), Math.cos(da));
    const toward = Math.max(0, 1 - Math.abs(da)/1.6)**1.5;              // how much this way faces the last light
    const band = Math.exp(-(((deg - 3.5)/5)**2))*toward;                 // a soft band a few degrees up
    c = c.lerp(rgb(.88,.48,.31), band*.85);
    c = c.lerp(rgb(.95,.70,.45), Math.exp(-(((deg - 2)/2.2)**2))*toward**2*.8);
    return c.lerp(FOG_COLOR, Math.max(0, 1 - Math.max(0, deg)/2.5)*(1 - toward*.7)); // the horizon line itself
}

// a dome round the camera, fine near the horizon where the band changes fastest; below it the fog's color
function buildStormSky()
{
    const mesh = new Mesh, SIDES = 160, rows = [-PI/2, -.2, -.02];
    for (let e = 0; e < .3; e += .012) rows.push(e);
    for (let e = .3; e < PI/2; e += .08) rows.push(e);
    rows.push(PI/2);
    const up = vec3(0, 1, 0);
    for (let j = 0; j < rows.length - 1; ++j)
    {
        const points = [], colors = [];
        for (let i = 0; i <= SIDES; ++i)
        {
            const a = i/SIDES*2*PI;
            for (const e of [rows[j+1], rows[j]])
            {
                points.push(vec3(Math.sin(a)*Math.cos(e), Math.sin(e), -Math.cos(a)*Math.cos(e)));
                colors.push(e < 0 ? FOG_COLOR.copy() : stormSkyColor(a, e));
            }
        }
        mesh.addStrip(points, up, undefined, colors);
    }
    mesh.doubleSided = true;
    mesh.dynamicDraw = true; // a strike repaints it
    skyMesh = mesh, skyBase = mesh.colors.map(c => c.copy());
    // what the sea reflects: the engine looks a sky's colors up by its mesh, as buildSky registers them, so this
    // dome registers its own, overhead, toward the horizon (the band's warmth averaged in), and below
    render3DSkyColors.set(mesh, [rgb(.16,.18,.42), rgb(.33,.31,.52), FOG_COLOR]);
    return mesh;
}

// a strike lights the sky round it: every point of the dome brightens by how near it is to the bolt as the camera
// sees it, plus a little all over, and goes back to its own color when the strike is over
const SKY_FLASH_COLOR = rgb(.5,.55,.85);
let skyMesh, skyBase, skyFlashing = false;
function updateSkyFlash()
{
    const camera = render3D.camera.pos, sources = [];
    for (const strike of strikes)
    {
        const f = flicker(stormTime - strike.start)*(strike.big ? 1.3 : 1)*(strike.kind == 'cloud' ? .7 : 1);
        const mid = strike.main[strike.main.length >> 2], d = mid.subtract(camera).normalize();
        f > 0 && sources.push({x: d.x, y: d.y, z: d.z, f});
    }
    if (!sources.length && !skyFlashing) return;
    skyFlashing = sources.length > 0;
    const points = skyMesh.points, colors = skyMesh.colors;
    for (let i = 0; i < points.length; ++i)
    {
        const p = points[i];
        let k = 0;
        for (const s of sources)
        {
            const d = Math.max(0, p.x*s.x + p.y*s.y + p.z*s.z);
            k += s.f*(.1 + .9*d**8);
        }
        const base = skyBase[i], c = colors[i];
        c.r = base.r + SKY_FLASH_COLOR.r*k, c.g = base.g + SKY_FLASH_COLOR.g*k, c.b = base.b + SKY_FLASH_COLOR.b*k;
    }
    skyMesh.dirty = true;
}

function buildSea()
{
    const mesh = buildGrid(vec2(SEA_SIZE), SEA_SEGMENTS, SEA_COLOR);
    sea = new EngineObject3D(vec3(), mesh);
    sea.shader = SEA_SHADER;
    sea.specular = 1.4;
    sea.shininess = 80;
    sea.reflectivity = .35;
}

const LANTERN_Y = SHELF_Y + 15.5, TOWER_HEIGHT = SHELF_Y + 20.7; // the middle of the lantern room, and the rod's tip
const ROCK_COLOR = rgb(.36,.37,.40), TOWER_WHITE = rgb(.92,.92,.95), TOWER_RED = rgb(.75,.18,.15);
const LANTERN_COLOR = rgb(1,.82,.56), WINDOW_COLOR = rgb(1,.69,.38);
// the tower's windows: height up the tower, angle round it (0 faces +z, the first shot's camera), and if a lamp is lit
const TOWER_WINDOWS = [[7.5, 0, true], [11.9, .7, true], [3.1, -1.2, false], [7.5, 2.3, false], [11.9, -1.7, true], [3.1, 1.6, true]];
let islandObject, towerObject, lanternObject, lanternLight, cottageLight;

// the rock's surface, worked out once as a square that repeats: a height of sharp ridges at five sizes, fine beds
// of strata and a web of cracks. Its slopes become the normal map that lights the smooth mesh as broken stone, and
// its height the grain, darker in the cracks and hollows
const ROCK_TILE = 9; // meters a repeat
function makeRockTextures()
{
    const size = 512, height = new Float32Array(size*size);
    const hash = (i, j, p, k) =>
    {
        const v = Math.sin(((i % p + p) % p)*127.1 + ((j % p + p) % p)*311.7 + k*74.7)*43758.5453;
        return v - Math.floor(v);
    };
    // smooth noise that repeats every p cells, so the square's edges meet
    const noise = (x, y, p, k) =>
    {
        const i = Math.floor(x), j = Math.floor(y);
        let fx = x - i, fy = y - j;
        fx = fx*fx*(3 - 2*fx), fy = fy*fy*(3 - 2*fy);
        const a = hash(i, j, p, k), b = hash(i + 1, j, p, k), c = hash(i, j + 1, p, k), d = hash(i + 1, j + 1, p, k);
        return a + (b - a)*fx + (c - a)*fy + (a - b - c + d)*fx*fy;
    };
    for (let y = 0; y < size; ++y)
    for (let x = 0; x < size; ++x)
    {
        const u = x/size, v = y/size;
        let h = 0;
        for (let o = 0, p = 4, amp = .5; o < 5; ++o, p *= 2, amp *= .55)
            h += amp*(1 - Math.abs(2*noise(u*p, v*p, p, o) - 1));
        h += .02*Math.sin(2*PI*(v*22 + noise(u*6, v*6, 6, 9)*4));
        h -= .4*Math.max(0, 1 - Math.abs(noise(u*7, v*7, 7, 20) - .5)/.03);
        height[y*size + x] = h;
    }
    const make = pixel =>
    {
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = size;
        const context = canvas.getContext('2d'), image = context.createImageData(size, size);
        for (let y = 0; y < size; ++y)
        for (let x = 0; x < size; ++x)
            pixel(image.data, (y*size + x)*4, x, y);
        context.putImageData(image, 0, 0);
        return new TextureInfo(canvas, true, true);
    };
    const at = (x, y) => height[(y + size) % size*size + (x + size) % size];
    const normal = make((data, i, x, y) =>
    {
        // green points up the image, so a height that rises down it leans the normal up
        const nx = (at(x - 1, y) - at(x + 1, y))*30, ny = (at(x, y + 1) - at(x, y - 1))*30, k = 1/Math.hypot(nx, ny, 1);
        data[i] = 127.5 + 127.5*nx*k, data[i+1] = 127.5 + 127.5*ny*k, data[i+2] = 127.5 + 127.5*k, data[i+3] = 255;
    });
    const grain = make((data, i, x, y) =>
    {
        data[i] = data[i+1] = data[i+2] = 255*clamp(.62 + .55*at(x, y));
        data[i+3] = 255;
    });
    return {normal, grain};
}

// the island's mesh: the height above, smooth, lit as broken stone by the rock's normal map, and colored by where
// it is - the rock's own bands, lighter on the level ledges, grass on the crown and in the hollows, dark and wet
// where the swells wash and weed at the waterline
function buildIsland()
{
    const moss = rgb(.30,.38,.24), weed = rgb(.12,.16,.14);
    const color = (x, z) =>
    {
        const y = islandHeightAt(x + .2, z + .2);
        const slope = Math.hypot(islandHeightAt(x + .6, z + .2) - y, islandHeightAt(x + .2, z + .6) - y)/.4;
        const n = islandNoise(x*.9 + 3, z*.9), band = islandNoise(y*1.7 + 20, (x + z)*.08);
        let c = ROCK_COLOR.scale((.7 + .35*n + .3*(band - .5))*(slope < .5 ? 1.15 : 1), 1);
        const grass = y > SHELF_Y - .1 && slope < .3 ? .8 : slope < .5 && y > 2 ? .5*n : 0;
        c = c.lerp(moss, grass);
        return c.scale(1 - .5*clamp((2.2 - y)/2.2), 1).lerp(weed, clamp((1 - y)/1.5)*.6);
    };
    const mesh = buildGrid(vec2(ISLAND_SIZE), 136, color, islandHeightAt, true);
    mesh.doubleSided = false;
    // the rock's square laid across the island leaning with the height, so it doesn't smear down the cliffs
    mesh.uvs = mesh.points.map(p => vec2((p.x + p.y*.9)/ROCK_TILE, (p.z + p.y*.9)/ROCK_TILE));
    const {normal, grain} = makeRockTextures();
    islandObject = new EngineObject3D(vec3(), mesh, grain);
    islandObject.normalMap = normal;
    islandObject.normalScale = 1.2;
    islandObject.specular = .45; // wet rock, the lightning glints on it
    islandObject.shininess = 28;
}

// the tower in white and red rings, its gallery, the glass lantern room and the red cap; the room glows on its own.
// Built from its foot up and stood on the crown
function buildLighthouse()
{
    const mesh = new Mesh;
    const radiusAt = y => 2.6 + (1.9 - 2.6)*y/13;
    const bands = [[0, 4, TOWER_WHITE], [4, 6, TOWER_RED], [6, 9, TOWER_WHITE], [9, 11, TOWER_RED], [11, 13, TOWER_WHITE]];
    for (const [y0, y1, color] of bands)
        mesh.combine(buildLathe([[radiusAt(y0), y0], [radiusAt(y1), y1]], 28, true, false), undefined, color);
    // weathered: the paint a little darker and dirtier toward the foot
    for (let i = 0; i < mesh.colors.length; ++i)
        mesh.colors[i] = mesh.colors[i].scale(.82 + .18*clamp(mesh.points[i].y/13), 1);
    const iron = rgb(.16,.17,.2), stone = rgb(.52,.52,.54), glass = rgb(.09,.11,.17);
    mesh.combine(buildBox(vec3(1.7, .6, .8)), vec3(0, .3, 3.6), stone);             // two steps up to the door
    mesh.combine(buildBox(vec3(1.7, .3, .7)), vec3(0, .15, 4.2), stone);
    mesh.combine(buildBox(vec3(1.45, 2.4, .3)), vec3(0, 2.1, radiusAt(2.1) - .12), stone); // the door's frame
    // window frames all the way up, the dark ones glazed here, the lit ones' panes drawn with the lamps below
    for (const [y, a, lit] of TOWER_WINDOWS)
    {
        const r = radiusAt(y), at = (out) => vec3((r + out)*Math.sin(a), y, (r + out)*Math.cos(a));
        mesh.combine(buildBox(vec3(.85, 1.15, .3)), buildMatrix(at(-.1), vec3(0, a, 0)), iron);
        lit || mesh.combine(buildBox(vec3(.55, .85, .3)), buildMatrix(at(-.05), vec3(0, a, 0)), glass);
    }
    mesh.combine(buildCylinder(6.6, .9, 28, true), vec3(0, .45, 0), stone);         // the plinth it stands on
    mesh.combine(buildBox(vec3(1.1, 2.1, .3)), vec3(0, 1.95, radiusAt(1.95) - .05), rgb(.24,.17,.13)); // the door
    for (let i = 0; i < 16; ++i)                                                   // brackets under the gallery
    {
        const a = i/16*2*PI;
        mesh.combine(buildBox(vec3(.25, .55, .9)), buildMatrix(vec3(2.3*Math.sin(a), 12.75, 2.3*Math.cos(a)), vec3(0, a, 0)), iron);
    }
    mesh.combine(buildCylinder(5.8, .5, 28, true), vec3(0, 13.25, 0), iron);       // gallery floor
    mesh.combine(buildTorus(5.9, .14, 28, 6, true), vec3(0, 13.5, 0), iron);       // its lip
    mesh.combine(buildTorus(5.5, .12, 28, 6, true), vec3(0, 14.4, 0), iron);       // its rail, and a lower one
    mesh.combine(buildTorus(5.5, .07, 28, 4, true), vec3(0, 13.95, 0), iron);
    for (let i = 0; i < 24; ++i)                                                   // and the rail's posts
        mesh.combine(buildCylinder(.08, .9, 4), vec3(2.75*Math.sin(i/24*2*PI), 13.95, 2.75*Math.cos(i/24*2*PI)), iron);
    for (const y of [14.06, 15.5, 16.94])                                          // rings round the lantern's glass
        mesh.combine(buildTorus(3.12, y == 15.5 ? .06 : .11, 20, 4, true), vec3(0, y, 0), iron);
    mesh.combine(buildBox(vec3(1.3, .06, .06)), vec3(0, 20.2, 0), iron);            // the weather vane
    mesh.combine(buildBox(vec3(.35, .3, .04)), vec3(-.55, 20.2, 0), iron);
    mesh.combine(buildCylinder(3.4, .4, 20, true), vec3(0, 17.2, 0), TOWER_RED);   // cap rim
    mesh.combine(buildCone(3.6, 1.6, 20, true), vec3(0, 18.2, 0), TOWER_RED);      // cap
    mesh.combine(buildSphere(.4, 8, 4, true), vec3(0, 19.1, 0), iron);             // finial
    mesh.combine(buildCylinder(.08, 1.6, 4), vec3(0, 19.9, 0), iron);              // and the rod the lightning finds
    for (let i = 0; i < 8; ++i)                                                    // the lantern room's frame
    {
        const a = (i + .5)/8*2*PI;
        mesh.combine(buildBox(vec3(.12, 3, .12)), vec3(1.55*Math.sin(a), 15.5, 1.55*Math.cos(a)), iron);
    }
    towerObject = new EngineObject3D(vec3(0, SHELF_Y, 0), mesh);
    towerObject.specular = .25;

    // the keeper's lamps behind some of the tower's windows, and the lamp over the door
    const windows = new Mesh;
    for (const [y, a, lit] of TOWER_WINDOWS)
        lit && windows.combine(buildBox(vec3(.55, .85, .3)), buildMatrix(vec3((radiusAt(y) - .05)*Math.sin(a), y, (radiusAt(y) - .05)*Math.cos(a)), vec3(0, a, 0)));
    windows.combine(buildSphere(.3, 6, 4), vec3(0, 3.55, radiusAt(3.55) + .1));
    const lit = new EngineObject3D(vec3(0, SHELF_Y, 0), windows, undefined, WINDOW_COLOR);
    lit.emissive = 1.2;

    // a dry stone wall round the crown, open in front of the door and where the cottage stands
    const wall = new Mesh, random = new RandomGenerator(3);
    for (let a = 0; a < 2*PI; a += .19)
    {
        const x = 4.85*Math.sin(a), z = 4.85*Math.cos(a), h = random.float(.45, .75);
        if (Math.abs(Math.atan2(Math.sin(a), Math.cos(a))) < .45 || Math.hypot(x - PAD.x, z - PAD.z) < PAD.r - .3) continue;
        wall.combine(buildBox(vec3(random.float(.75, 1), h, random.float(.35, .5))),
            buildMatrix(vec3(x, h/2, z), vec3(0, a + random.float(-.12, .12), 0)), ROCK_COLOR.scale(random.float(1, 1.5), 1));
    }
    new EngineObject3D(vec3(0, SHELF_Y, 0), wall);

    // the glass, lit from inside: drawn in its own warm color, bright enough to bloom
    lanternObject = new EngineObject3D(vec3(0, LANTERN_Y, 0), buildCylinder(3, 3, 16, true), undefined, LANTERN_COLOR);
    lanternObject.emissive = 1.6;
    lanternLight = new Light3D(vec3(0, LANTERN_Y, 0), 85, LANTERN_COLOR, 1.05);
}

// the keeper's cottage beside the tower: stone walls, a slate roof and one warm window
function buildCottage()
{
    const yaw = -.5, pos = vec3(PAD.x, SHELF_Y, PAD.z);
    const mesh = buildBox(vec3(4.6, 2.8, 3.6), .08).setColor(rgb(.72,.70,.66));
    mesh.transform(buildMatrix(vec3(0, 1.4, 0)));
    // the roof: a gable, flat underneath, its eaves and its ends overhanging the walls all round. Six corners, the
    // two eaves and the ridge at each end, and the triangles over them: the ends, the two slopes and the underside
    const w = 2.5, h = 1.3, l = 2.05, eaves = 2.7;
    const roof = new Mesh().addTriangles(
        [vec3(-w, eaves, -l), vec3(w, eaves, -l), vec3(0, eaves + h, -l), vec3(-w, eaves, l), vec3(w, eaves, l), vec3(0, eaves + h, l)],
        [3,4,5, 1,0,2, 4,1,2, 4,2,5, 0,3,5, 0,5,2, 0,1,4, 0,4,3]).computeNormals(false);
    mesh.combine(roof, undefined, rgb(.22,.24,.3));
    mesh.combine(buildBox(vec3(.6, 1.6, .6)), vec3(1.3, 3.7, .6), rgb(.5,.47,.44)); // chimney
    mesh.combine(buildBox(vec3(4.8, .5, 3.8)), vec3(0, .25, 0), rgb(.45,.44,.44));  // a footing of darker stone
    mesh.combine(buildBox(vec3(.9, 1.8, .14)), vec3(-1.25, .9, 1.8), rgb(.24,.17,.13)); // the door
    mesh.combine(buildBox(vec3(1.25, 1.05, .14)), vec3(.8, 1.5, 1.78), rgb(.3,.3,.33)); // window frames
    mesh.combine(buildBox(vec3(.14, 1.05, 1.15)), vec3(2.28, 1.5, -.3), rgb(.3,.3,.33));
    const cottage = new EngineObject3D(pos, mesh);
    cottage.rotation3D = vec3(0, yaw, 0);

    // warm windows, one facing the sea and the camera and one round the side
    const panes = buildBox(vec3(1, .8, .16)).transform(buildMatrix(vec3(.8, 1.5, 1.8)));
    panes.combine(buildBox(vec3(.16, .8, .9)), vec3(2.3, 1.5, -.3));
    const lit = new EngineObject3D(pos, panes, undefined, WINDOW_COLOR);
    lit.rotation3D = vec3(0, yaw, 0);
    lit.emissive = 1.3;
    // a place in the cottage's own frame out in the world: its front is +z turned by yaw
    const world = (x, y, z) => pos.add(vec3(x*Math.cos(yaw) + z*Math.sin(yaw), y, z*Math.cos(yaw) - x*Math.sin(yaw)));
    cottageLight = new Light3D(world(.8, 1.5, 3), 9, WINDOW_COLOR, 1);

    // the keeper's fire: smoke from the chimney, torn off downwind, lit by the lightning as the clouds are
    const smoke = new ParticleEmitter3D(world(1.3, 4.6, .6), .3, 0, 10, .3, sprayTiles[0],
        rgb(.55,.55,.6,.4), rgb(.45,.45,.52,.3), rgb(.5,.5,.56,0), rgb(.5,.5,.56,0), 2.6, .7, 3.4, .035, .98, .0003, .3, .3);
    smoke.gravityScale = 1, smoke.angleSpeed = .01;
}

///////////////////////////////////////////////////////////////////////////////
// LIGHTNING BEGIN - the strike schedule, the flicker and the bolt's path, plain math only so node can test it
//
// A strike is light first: a few point lights at the bolt and in the cloud layer, flaring on a hand made flicker
// (full, a dip, a second stroke, a fade) over less than half a second, so the sea, the rocks and the cloud bellies
// light up from where it is. The bolt itself is a jagged line, bright enough to bloom. Everything about when and
// where comes from the storm's seed, so a recording shows the same storm every time.

const STRIKE_LENGTH = .45;          // seconds a strike lights the scene
const CLOUD_BASE_Y = 45;            // the cloud layer's underside
const STRIKE_GAP_MIN = 4, STRIKE_GAP_MAX = 9;

function flicker(age)
{
    if (age < 0 || age >= STRIKE_LENGTH) return 0;
    if (age < .05) return 1;
    if (age < .09) return 1 - .75*(age - .05)/.04;
    if (age < .14) return .25 + .55*(age - .09)/.05;
    const fade = 1 - (age - .14)/(STRIKE_LENGTH - .14);
    return .8*fade*fade;
}

// when and where the storm strikes: the cinematic's five set pieces, or a long seeded run for the live page.
// Live strikes stay in the half of the sea the camera faces, never nearer the camera's path than 40m
function makeSchedule(random, cinematic)
{
    if (cinematic)
        return [
            {t: 3.5,  kind: 'cloud',  x: -30, y: CLOUD_BASE_Y, z: -90},
            {t: 11,   kind: 'ground', x: 45,  y: 0, z: -20},
            {t: 15,   kind: 'cloud',  x: 35,  y: CLOUD_BASE_Y, z: -60},
            {t: 18.5, kind: 'ground', x: 18,  y: 0, z: -34, big: true},
            {t: 23,   kind: 'cloud',  x: -45, y: CLOUD_BASE_Y, z: -100},
        ];
    const strikes = [];
    for (let t = 2 + random()*3; t < 3600; t += STRIKE_GAP_MIN + random()*(STRIKE_GAP_MAX - STRIKE_GAP_MIN))
    {
        const cloud = random() < .6, angle = (random()*2 - 1)*1.4, r = 30 + random()*90;
        strikes.push({t, kind: cloud ? 'cloud' : 'ground', x: r*Math.sin(angle), y: cloud ? CLOUD_BASE_Y : 0,
            z: -r*Math.cos(angle), big: !cloud && random() < .2});
    }
    return strikes;
}

// a bolt from a to b: the line split in half six times, each midpoint knocked aside, square to the bolt's way, by a
// share of its segment's length, and moved along the way only inside its own segment, so the channel wanders and
// jags but never turns back on itself. Branches fork off it partway down, thinner, and some fork again. A bolt that
// mostly falls jags sideways; one that runs level across the cloud jags up, down and sideways
function boltPoints(a, b, seed, big=false)
{
    let s = (seed*2246822519 >>> 0) || 1;
    const random = () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return (s >>> 0)/4294967296 - .5; };
    const split = (points, roughs) =>
    {
        const first = points[0], last = points.at(-1);
        const dx = last.x - first.x, dy = last.y - first.y, dz = last.z - first.z;
        const length = Math.hypot(dx, dy, dz) || 1, falls = Math.abs(dy)/length > .7, h = Math.hypot(dx, dz) || 1;
        // the way it goes, and the two ways across it the jags go
        const axis = falls ? [0, Math.sign(dy), 0] : [dx/h, 0, dz/h];
        const u = falls ? [1, 0, 0] : [-dz/h, 0, dx/h], v = falls ? [0, 0, 1] : [0, 1, 0];
        for (const rough of roughs)
        {
            const next = [points[0]];
            for (let i = 1; i < points.length; ++i)
            {
                const p = points[i-1], q = points[i], len = Math.hypot(q.x - p.x, q.y - p.y, q.z - p.z);
                const span = (q.x - p.x)*axis[0] + (q.y - p.y)*axis[1] + (q.z - p.z)*axis[2];
                const ou = random()*len*rough, ov = random()*len*rough, along = random()*.3*span;
                next.push({x: (p.x + q.x)/2 + u[0]*ou + v[0]*ov + axis[0]*along,
                    y: (p.y + q.y)/2 + u[1]*ou + v[1]*ov + axis[1]*along,
                    z: (p.z + q.z)/2 + u[2]*ou + v[2]*ov + axis[2]*along}, q);
            }
            points = next;
        }
        return points;
    };
    const main = split([{...a}, {...b}], [.3, .4, .45, .45, .45, .45]);
    const total = Math.hypot(b.x - a.x, b.y - a.y, b.z - a.z), branches = [];
    // a branch: from a point on its parent, on down and out the side, a share of the bolt's length
    const fork = (parent, at, reach, weight) =>
    {
        const from = parent[at], ahead = parent[Math.min(at + 4, parent.length - 1)];
        const len = Math.hypot(ahead.x - from.x, ahead.y - from.y, ahead.z - from.z) || 1;
        const side = random()*2*Math.PI, kick = .7 + (random() + .5)*.6;
        let x = (ahead.x - from.x)/len + Math.cos(side)*kick, y = Math.min((ahead.y - from.y)/len, 0) - .6;
        let z = (ahead.z - from.z)/len + Math.sin(side)*kick;
        const d = Math.hypot(x, y, z);
        const end = {x: from.x + x/d*reach, y: from.y + y/d*reach, z: from.z + z/d*reach};
        const points = split([{...from}, end], [.45, .45, .45, .45]);
        branches.push({points, weight});
        return points;
    };
    const count = (big ? 6 : 3) + ((random() + .5)*(big ? 2.99 : 2.99) | 0);
    for (let i = 0; i < count; ++i)
    {
        const share = .08 + (random() + .5)*.62, at = Math.round(share*(main.length - 1));
        const points = fork(main, at, total*(.15 + (random() + .5)*.2)*(1 - share*.5), .35 + (random() + .5)*.25);
        if (random() < -.1 && branches.length < 8)
            fork(points, Math.round(points.length*(.3 + (random() + .5)*.3)), total*.08, .2);
    }
    return {main, branches: branches.slice(0, 8)};
}
// LIGHTNING END

const LIGHTNING_POOL = 6, LIGHTNING_COLOR = rgb(.87,.91,1);
const STRIKE_RADIUS = 150, STRIKE_INTENSITY = 4, BIG_STRIKE_INTENSITY = 6;
const CLOUD_LIGHT_RADIUS = 70, CLOUD_LIGHT_SCALE = .45; // the lights inside the deck: shorter reach, dimmer
const lightningLights = [], strikes = [];
let strikeSchedule = [], nextStrike = 0, stormRandom, strikeCount = 0;

// the lights a strike borrows, made once and switched off between strikes
function buildLightning()
{
    for (let i = 0; i < LIGHTNING_POOL; ++i)
        lightningLights.push(new Light3D(vec3(), STRIKE_RADIUS, LIGHTNING_COLOR, 0));
    render3D.onRenderTransparent = () => { drawClouds(); drawRipples(); drawBolts(); drawLanternGlow(); };
}

// a new storm from the seed: R steps the seed, so the live page shows another storm
function scheduleStrikes()
{
    stormRandom = new RandomGenerator(stormSeed);
    strikeSchedule = makeSchedule(() => stormRandom.float(), cinematic);
    nextStrike = 0;
    while (strikes.length) endStrike(strikes[0]);
}

function endStrike(strike)
{
    for (const light of strike.lights) light.intensity = 0;
    strikes.splice(strikes.indexOf(strike), 1);
}

// kind is 'cloud' (lights inside the layer, a bolt across it) or 'ground' (a bolt down to pos, a light where it hits)
function startStrike(kind, pos, big=false, at=stormTime)
{
    const count = big ? 3 : 2;
    const free = () => lightningLights.filter(l => !strikes.some(s => s.lights.includes(l)));
    while (free().length < count && strikes.length) endStrike(strikes[0]); // too many at once: the oldest goes dark
    const lights = free().slice(0, count), seed = ++strikeCount*7.31 + stormSeed;
    let bolt;
    if (kind == 'cloud')
    {
        // the bolt runs across the underside of the layer, the lights strung along it inside the cloud
        const angle = (seed*1.7) % (2*PI), span = 50 + (seed*13.1) % 30;
        const a = {x: pos.x - Math.cos(angle)*span/2, y: pos.y, z: pos.z - Math.sin(angle)*span/2};
        const b = {x: pos.x + Math.cos(angle)*span/2, y: pos.y - 4, z: pos.z + Math.sin(angle)*span/2};
        bolt = boltPoints(a, b, seed, big);
        lights.forEach((l, i) => l.pos3D = vec3(a.x + (b.x - a.x)*(i + .5)/count, pos.y + 6, a.z + (b.z - a.z)*(i + .5)/count));
        lights.forEach(l => l.inCloud = true);
    }
    else
    {
        // from the cloud base straight above, down to the water; one light just over the strike point, the rest up
        // in the cloud it came out of
        const top = {x: pos.x + ((seed*3.3) % 20) - 10, y: CLOUD_BASE_Y, z: pos.z + ((seed*5.7) % 20) - 10};
        bolt = boltPoints(top, {x: pos.x, y: pos.y, z: pos.z}, seed, big);
        if (Math.hypot(pos.x, pos.z) > MOUND_RADIUS) makeSplash(pos, big); // on the open sea, not the rocks
        lights.forEach((l, i) => l.pos3D = i ? vec3(top.x + (i - 1.5)*15, CLOUD_BASE_Y + 6, top.z) : vec3(pos.x, pos.y + 4, pos.z));
        lights.forEach((l, i) => l.inCloud = i > 0);
    }
    const toVec = list => list.map(p => vec3(p.x, p.y, p.z));
    strikes.push({kind, start: at, big, lights, main: toVec(bolt.main),
        branches: bolt.branches.map(b => ({points: toVec(b.points), weight: b.weight}))});
    queueThunder(kind, pos, big);
}

// each frame: start what the schedule says is due, and drive every live strike's lights by its flicker
function updateLightning()
{
    while (nextStrike < strikeSchedule.length && strikeSchedule[nextStrike].t <= stormTime)
    {
        const s = strikeSchedule[nextStrike++], p = strikeTarget(s.kind, s.x, s.y, s.z, time);
        startStrike(s.kind, vec3(p.x, p.y, p.z), s.big, s.t);
    }
    let flash = 0;
    for (const strike of [...strikes])
    {
        const age = stormTime - strike.start;
        if (age >= STRIKE_LENGTH) { endStrike(strike); continue; }
        const f = flicker(age);
        flash += f*(strike.big ? 1.3 : 1)*(strike.kind == 'cloud' ? .6 : 1);
        for (const light of strike.lights)
        {
            light.radius = light.inCloud ? CLOUD_LIGHT_RADIUS : STRIKE_RADIUS;
            light.intensity = f*(strike.big ? BIG_STRIKE_INTENSITY : STRIKE_INTENSITY)*(light.inCloud ? CLOUD_LIGHT_SCALE : 1);
            light.glow = light.inCloud ? 0 : 7*f;
        }
    }
    flash = Math.min(flash, 1.5);
    render3D.ambientColor = rgb(AMBIENT_COLOR.r + AMBIENT_FLASH.r*flash, AMBIENT_COLOR.g + AMBIENT_FLASH.g*flash,
        AMBIENT_COLOR.b + AMBIENT_FLASH.b*flash);
    updateSkyFlash();
}

// the bolts, in the transparent stage: a wide faint haze, a glow and a white core, all added onto the scene. The main
// channel holds through the restrike; the branches thin to their tips and are gone after the first stroke, as a
// real bolt's are. Where one meets the sea its light's own glow flares on the water
function drawBolts()
{
    if (!strikes.length) return;
    render3D.additive = true;
    for (const strike of strikes)
    {
        const age = stormTime - strike.start, f = flicker(age);
        if (f <= 0) continue;
        const width = strike.big ? 1.5 : 1, branchFade = f*Math.max(0, 1 - Math.max(0, age - .1)/.12);
        const draw = (points, w, alpha, taper) =>
        {
            const widths = taper ? points.map((p, i) => 1 - .85*i/(points.length - 1)) : undefined;
            for (const [scale, color] of [[7, rgb(.45,.5,1,.06*alpha)], [2.2, rgb(.6,.7,1,.3*alpha)], [.4, rgb(1,1,1,alpha)]])
                render3D.drawRibbon(points, widths ? widths.map(k => k*w*scale) : w*scale, undefined, color);
        };
        draw(strike.main, width, f, false);
        if (branchFade > 0)
            for (const branch of strike.branches)
                draw(branch.points, width*branch.weight, branchFade*(.5 + branch.weight), true);
    }
    render3D.additive = false;
}

// a bolt into the sea: a crown of droplets thrown up and out, a column in the middle, a cloud of steam and spray
// that drifts off downwind, and a ring of foam spreading on the swell
const ripples = [];
function makeSplash(pos, big)
{
    const k = big ? 1.4 : 1, white = rgb(1,1,1,.95), blue = rgb(.85,.92,1,.9), clear = rgb(.9,.95,1,0);
    const at = vec3(pos.x, pos.y, pos.z);
    const emit = (tile, rate, cone, size0, size1, life, speed, gravity, damping, colorA, colorB, seconds=.1) =>
    {
        const e = new ParticleEmitter3D(at, 1.5*k, seconds, rate, cone, tile, colorA, colorB, clear, clear,
            life, size0, size1, speed, damping, gravity, .3, .4);
        e.emissive = .4;
        return e;
    };
    const crown = emit(puffTile, 2400*k, PI/3, 1.1, .6, 1.7, .44*k, -.009, .99, white, blue);
    crown.trailTime = .08;
    const column = emit(puffTile, 700*k, PI/16, 1.5, .8, 1.8, .6*k, -.009, .99, white, blue);
    column.trailTime = .06;
    // the body of the water thrown up, torn sheets of it turning as they rise and fall back
    const body = emit(sprayTiles[randInt(4)], 280*k, PI/8, 2.5*k, 8*k, 1.3, .4*k, -.008, .98, rgb(.85,.9,1,.5), rgb(.75,.82,.95,.4));
    body.angleSpeed = .03, body.emissive = .15;
    const mist = emit(sprayTiles[randInt(4)], 160*k, PI/2.5, 4*k, 13*k, 2.6, .16, .0006, .965, rgb(.9,.93,1,.22), rgb(.8,.85,.95,.15), .15);
    mist.emitSize = 5*k, mist.angleSpeed = .008, mist.emissive = .15;
    mist.gravityScale = 1;
    ripples.push({x: pos.x, z: pos.z, start: time, k});
    // the splash is heard when the thunder is, just after its crack: sound from out there all takes the same time
    const distance = render3D.camera.pos.distance(at);
    recordMode || thunderDue.push({at: time + thunderDelay(distance) + .12, crash: .7*k*thunderLoudness(distance).roll});
}

// the foam rings, drawn as puffs round a widening circle on the moving water
function drawRipples()
{
    for (const r of [...ripples])
    {
        const age = time - r.start, p = age/3;
        if (p >= 1) { ripples.splice(ripples.indexOf(r), 1); continue; }
        const radius = (2 + 15*(1 - (1 - p)**2))*r.k, count = 36, fade = (1 - p)**1.5;
        for (let i = 0; i < count; ++i)
        {
            const a = i/count*2*PI + r.x, x = r.x + Math.cos(a)*radius, z = r.z + Math.sin(a)*radius;
            render3D.drawBillboard(vec3(x, seaHeightAt(x, z, time) + .3, z), vec2(2.2 + 2*p, 1.2 + p),
                puffTile, rgb(.9,.95,1,.75*fade));
        }
    }
}

///////////////////////////////////////////////////////////////////////////////
// CLOUDS BEGIN - where the clouds are and how they drift, plain math only so node can test it
//
// The storm's sky: big clouds low over the sea, one sprite each, in two decks. The low deck has its feet near the
// base the lightning comes out of; the high deck is bigger, darker clouds well above it, filling the sky behind. In
// a deck the clouds stand on a loose grid, far enough apart that two the same distance from the camera never
// overlap by more than their thin ends, since that is where the draw order between them can change and a change
// shows as a pop; the decks are too far apart in height to meet. Everything drifts downwind as one and wraps round
// inside a box centered on the island, each cloud fading out toward the box's edge so the wrap is never seen.

const CLOUD_BOX = 560, CLOUD_VARIANTS = 6;
const CLOUD_DECKS = [   // clouds a side, the lowest foot above the base and how much higher a foot may be, size, shade
    {grid: 6, foot: 0,  rise: 20, size: [.95, 1.2],  shade: 1},
    {grid: 4, foot: 75, rise: 25, size: [1.05, 1.2], shade: .7},
];
const CLOUD_SPEED = 2;      // meters a second downwind
const CLOUD_FADE = 70;      // a cloud fades out over this far from the box's edge
const CLOUD_FOOT = .2;      // how far up a cloud's sprite its flat foot is, the rest below is clear
const CLOUD_BODY = .72;     // and how far up its top can reach

function cloudLayout(seed)
{
    let s = (seed*2654435761 >>> 0) || 1;
    const random = (a=0, b=1) => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return a + (b - a)*(s >>> 0)/4294967296; };
    const clouds = [];
    CLOUD_DECKS.forEach((deck, d) =>
    {
        const spacing = CLOUD_BOX/deck.grid;
        for (let j = 0; j < deck.grid; ++j)
        for (let i = 0; i < deck.grid; ++i)
        {
            // every other row stands half a step along, so the rows never line up into streets
            const size = spacing*random(deck.size[0], deck.size[1]), foot = CLOUD_BASE_Y + deck.foot + random(0, deck.rise);
            clouds.push({deck: d, variant: (i + j*deck.grid + d)*5 % CLOUD_VARIANTS,
                x: (i + .5 + j % 2*.5 + random(-.06, .06))*spacing - CLOUD_BOX/2,
                y: foot + size/2*(.5 - CLOUD_FOOT), // a sprite is half as tall as it is wide
                z: (j + .5 + random(-.06, .06))*spacing - CLOUD_BOX/2,
                size, shade: deck.shade*random(.88, 1.08), alpha: random(.9, 1), mirror: random() < .5});
        }
    });
    return clouds;
}

function cloudPosAt(cloud, t)
{
    const wrap = v => ((v + CLOUD_BOX/2) % CLOUD_BOX + CLOUD_BOX) % CLOUD_BOX - CLOUD_BOX/2;
    const x = wrap(cloud.x + WIND_DIR[0]*CLOUD_SPEED*t), z = wrap(cloud.z + WIND_DIR[1]*CLOUD_SPEED*t);
    const edge = CLOUD_BOX/2 - Math.max(Math.abs(x), Math.abs(z));
    return {x, y: cloud.y, z, fade: Math.min(Math.max(edge/CLOUD_FADE, 0), 1)};
}
// CLOUDS END

// the color a cloud's sprite is drawn in: lit by the ambient, the low warm sun and any lightning near it, so it is
// darker than it shows. The sprites carry their own light baked in, bright tops shading down to a dark flat foot,
// so they read as clouds before the lightning finds them
const CLOUD_COLOR = rgb(.8,.84,1);
const CLOUD_EMISSIVE = .6; // the share of its color a cloud keeps unlit, so the dark side never goes muddy
const CLOUD_CELL = vec2(512, 256); // each baked shape's cell in the cloud texture
let clouds, cloudTiles = [], puffTile, glowTile, sprayTiles;

// a soft round puff, white fading to clear, for the spray and the mist
function makePuffTexture()
{
    const size = 64, canvas = document.createElement('canvas');
    canvas.width = canvas.height = size;
    const context = canvas.getContext('2d');
    const g = context.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(.45, 'rgba(255,255,255,.55)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    context.fillStyle = g;
    context.fillRect(0, 0, size, size);
    return new TextureInfo(canvas);
}

// thrown water and spray: a round patch torn into wisps and holes by noise, a few different ones
function makeSprayTextures()
{
    const size = 128, count = 4, canvas = document.createElement('canvas');
    canvas.width = size*count, canvas.height = size;
    const context = canvas.getContext('2d'), image = context.createImageData(size*count, size), data = image.data;
    for (let v = 0; v < count; ++v)
    for (let y = 0; y < size; ++y)
    for (let x = 0; x < size; ++x)
    {
        const px = x/size, py = y/size, r = Math.hypot(px - .5, py - .5)*2, o = v*20;
        const n = islandNoise(px*5 + o, py*5)*.55 + islandNoise(px*11 + o, py*11)*.3 + islandNoise(px*23, py*23 + o)*.15;
        const i = (y*size*count + v*size + x)*4;
        data[i] = data[i+1] = data[i+2] = 255;
        data[i+3] = 255*clamp((1 - r**1.4)*1.8*(n*2 - .5));
    }
    context.putImageData(image, 0, 0);
    const texture = new TextureInfo(canvas);
    return Array.from({length: count}, (_, v) => new TileInfo(vec2(v*size, 0), vec2(size), texture, 0, 1));
}

// a light's soft glow, for the lamp and where a bolt meets the sea
function makeGlowTexture()
{
    const size = 128, canvas = document.createElement('canvas');
    canvas.width = canvas.height = size;
    const context = canvas.getContext('2d');
    const g = context.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(.12, 'rgba(255,255,255,.6)');
    g.addColorStop(.4, 'rgba(255,255,255,.12)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    context.fillStyle = g;
    context.fillRect(0, 0, size, size);
    return new TextureInfo(canvas);
}

// the cloud shapes, worked out once, pixel by pixel. A cloud is a thickness: a domed outline with a wandering top
// and a flat foot, swollen and pinched by a field of round lumps (one less the distance to the nearest of a scatter
// of points, big ones and small) and frayed by fine noise, so its edge billows instead of tracing circles. Its light
// is the sun's from above: each pixel is dimmed by how much cloud lies over it, and the lumps catch the light on
// their upper left, so the top is bright, the body rounded and the foot dark
function buildClouds()
{
    const w = CLOUD_CELL.x, h = CLOUD_CELL.y, columns = 3, canvas = document.createElement('canvas');
    canvas.width = w*columns, canvas.height = h*Math.ceil(CLOUD_VARIANTS/columns);
    const context = canvas.getContext('2d');
    const hash = (i, j, k) => { const v = Math.sin(i*127.1 + j*311.7 + k*74.7)*43758.5453; return v - Math.floor(v); };
    const lumps = (x, y, k) =>
    {
        const i = Math.floor(x), j = Math.floor(y);
        let best = 9;
        for (let a = -1; a <= 1; ++a)
        for (let b = -1; b <= 1; ++b)
        {
            const dx = i + a + hash(i + a, j + b, k) - x, dy = j + b + hash(i + a, j + b, k + 1) - y;
            best = Math.min(best, dx*dx + dy*dy);
        }
        return 1 - Math.min(1, Math.sqrt(best));
    };
    const ease = v => { v = clamp(v); return v*v*(3 - 2*v); };
    const density = new Float32Array(w*h), relief = new Float32Array(w*h), light = new Float32Array(w*h);
    for (let v = 0; v < CLOUD_VARIANTS; ++v)
    {
        for (let y = 0; y < h; ++y)
        for (let x = 0; x < w; ++x)
        {
            // across -1 to 1, up 0 at the sprite's bottom to 1 at its top, and the place in units of its height
            const across = (x + .5)/w*2 - 1, up = 1 - (y + .5)/h, px = x/h, py = y/h;
            const wander = islandNoise(px*1.6 + v*13, v*7.3)*.6 + islandNoise(px*4 + v*5, v*3.1)*.4;
            const top = CLOUD_FOOT + (CLOUD_BODY + .1 - CLOUD_FOOT)*Math.max(0, 1 - across*across)**.55*(.45 + .55*wander);
            const lump = lumps(px*4.5 + v*9, py*4.5, v)*.65 + lumps(px*10 + v*4, py*10, v + 5)*.35;
            const fine = islandNoise(px*14 + v, py*14)*.6 + islandNoise(px*30, py*30 + v)*.4;
            let d = (top - up)*4 + (lump - .5)*1.1 + (fine - .5)*.3;
            d = Math.min(d, (up - CLOUD_FOOT)*8 + (fine - .5)*.8 + .1, (1 - Math.abs(across))*8);
            density[y*w + x] = ease(d/.65);
            relief[y*w + x] = lump + fine*.25;
        }
        // the light left after coming down through the cloud above, softened sideways so no column shows
        for (let x = 0; x < w; ++x)
            for (let y = 0, over = 0; y < h; ++y)
                light[y*w + x] = Math.exp(-over*4.2), over += density[y*w + x]/h;
        for (let pass = 0; pass < 2; ++pass)
        for (let y = 0; y < h; ++y)
        {
            let sum = 0;
            const row = light.slice(y*w, y*w + w), R = 5;
            for (let x = -R; x < w; ++x)
            {
                x + R < w && (sum += row[x + R]);
                x - R - 1 >= 0 && (sum -= row[x - R - 1]);
                x >= 0 && (light[y*w + x] = sum/(Math.min(w - 1, x + R) - Math.max(0, x - R) + 1));
            }
        }
        const image = context.createImageData(w, h), data = image.data;
        for (let y = 0; y < h; ++y)
        for (let x = 0; x < w; ++x)
        {
            const i = y*w + x, x0 = Math.max(x - 2, 0), x1 = Math.min(x + 2, w - 1), y0 = Math.max(y - 2, 0), y1 = Math.min(y + 2, h - 1);
            // the lumps' slope toward the light, up and to the left
            const slope = (relief[y*w + x0] - relief[y*w + x1])*.45 + (relief[y0*w + x] - relief[y1*w + x])*.9;
            // thin edges let the light through, the silver lining
            const b = clamp(light[i]*(.5 + .5*clamp(.5 + slope*5) + .35*(1 - density[i])));
            data[i*4] = 52 + 203*b, data[i*4 + 1] = 56 + 199*b, data[i*4 + 2] = 90 + 165*b;
            data[i*4 + 3] = 255*density[i];
        }
        context.putImageData(image, v % columns*w, (v/columns | 0)*h);
    }
    const texture = new TextureInfo(canvas);
    for (let v = 0; v < CLOUD_VARIANTS; ++v)
        cloudTiles.push(new TileInfo(vec2(v % columns*w, (v/columns | 0)*h), CLOUD_CELL, texture, 0, 1));
    puffTile = makePuffTexture();
    glowTile = makeGlowTexture();
    sprayTiles = makeSprayTextures();
    clouds = cloudLayout(stormSeed);
}

// in the transparent stage, sorted far to near by the engine with the rest; lit, so a strike lights the clouds
// round it. The ones toward the last light take its warmth
function drawClouds()
{
    const camera = render3D.camera.pos;
    render3D.emissive = CLOUD_EMISSIVE;
    for (const c of clouds)
    {
        const p = cloudPosAt(c, stormTime);
        if (!p.fade) continue;
        let da = Math.atan2(p.x - camera.x, -(p.z - camera.z)) - SUN_AZIMUTH;
        da = Math.atan2(Math.sin(da), Math.cos(da));
        const warm = Math.max(0, 1 - Math.abs(da)/1.2)**2*.3, k = c.shade;
        const color = rgb(CLOUD_COLOR.r*k*(1 + warm*.7), CLOUD_COLOR.g*k*(1 + warm*.2), CLOUD_COLOR.b*k*(1 - warm*.2), c.alpha*p.fade);
        render3D.drawBillboard(vec3(p.x, p.y, p.z), vec2(c.size*(c.mirror ? -1 : 1), c.size/2), cloudTiles[c.variant], color);
    }
    render3D.emissive = 0;
}

///////////////////////////////////////////////////////////////////////////////
// CINE BEGIN - the cinematic's curves, plain math only so node can test it
//
// After the big strike the storm closes in: the rain thickens over the last stretch before the end card. The big
// strike also kicks the picture apart into a chromatic fringe for its brightest frames, as an overexposed lens does.

const CINE_RAIN_START = 18.5, CINE_RAIN_FULL = 25.5, CINE_RAIN_MAX = 1.6;

function cineRainRate(t)
{
    const p = Math.min(Math.max((t - CINE_RAIN_START)/(CINE_RAIN_FULL - CINE_RAIN_START), 0), 1);
    return 1 + (CINE_RAIN_MAX - 1)*p*p*(3 - 2*p);
}

const bigStrikeChroma = age => .012*flicker(age);
// CINE END

// the picture as a whole: the fringe first since it samples the frame, then bloom for the lamp, the bolts and the
// beam, and a soft vignette to hold the eye on the tower
function buildPost()
{
    new PostProcessPlugin(postProcessEffects(postProcessChromatic('chroma'), postProcessGlow(.72, .8, 8),
        postProcessVignette(.55, 2.5)));
    postProcess.values.chroma = 0;
}

function updatePost()
{
    let chroma = 0;
    for (const strike of strikes)
        if (strike.big) chroma = Math.max(chroma, bigStrikeChroma(stormTime - strike.start));
    postProcess.values.chroma = chroma;
}

///////////////////////////////////////////////////////////////////////////////
// BEAM BEGIN - the beam's turn, which raindrops are in it, and the rain's fall, plain math only so node can test it
//
// The beam is not a light: it shines into the air with nothing to land on, so it is only what you see of it, a
// long soft cone of light in the rain. Two of them back to back turn level from the lantern, as a real lamp's do.
// The rain is a box of streaks round the camera, falling and blowing downwind, wrapping as the camera moves.

const BEAM_PERIOD = 6;                        // seconds a turn
const BEAM_LENGTH = 160, BEAM_RADIUS_START = .7, BEAM_RADIUS_END = 9;
const RAIN_BOX = 90, RAIN_TOP = CLOUD_BASE_Y - 5, RAIN_BOTTOM = -2;
const RAIN_SPEED = 22, RAIN_WIND = 6;         // meters a second down, and along the wind

const beamYawAt = t => 2*Math.PI*t/BEAM_PERIOD;

// is a point inside the beam turned to yaw (0 shines down -Z, as the camera's yaw does)
function insideBeamMath(px, py, pz, yaw)
{
    const dx = -Math.sin(yaw), dz = -Math.cos(yaw);
    const vx = px, vy = py - LANTERN_Y, vz = pz;
    const along = vx*dx + vz*dz;
    if (along <= 0 || along > BEAM_LENGTH) return false;
    const radius = BEAM_RADIUS_START + (BEAM_RADIUS_END - BEAM_RADIUS_START)*along/BEAM_LENGTH;
    const ox = vx - dx*along, oz = vz - dz*along;
    return ox*ox + vy*vy + oz*oz < radius*radius;
}

// one drop's step: down and downwind, wrapped into the box round the camera and back to the top once it is under
// the water, so the same few thousand streaks are always where the camera can see them
function rainStep(x, y, z, dt, cameraX, cameraZ)
{
    const wrap = (v, c) => c + ((v - c + RAIN_BOX/2) % RAIN_BOX + RAIN_BOX) % RAIN_BOX - RAIN_BOX/2;
    x += WIND_DIR[0]*RAIN_WIND*dt;
    z += WIND_DIR[1]*RAIN_WIND*dt;
    y -= RAIN_SPEED*dt;
    if (y < RAIN_BOTTOM) y += RAIN_TOP - RAIN_BOTTOM;
    return {x: wrap(x, cameraX), y, z: wrap(z, cameraZ)};
}
// BEAM END

const BEAM_COLOR = rgb(1,.89,.66);
const RAIN_COUNT = 3000;                      // streaks in the box, raised by the cinematic's rain rate
const RAIN_MAX = Math.ceil(RAIN_COUNT*CINE_RAIN_MAX);
const RAIN_CLEAR = 6;                         // drops nearer the lens than this are hidden, or they'd fill the frame as bars
let beamYaw = 0, beams = [], rain, lanternGlow = 0;

// the visible beam: brightest along its middle and at the lamp, fading toward its far end and its edges as a lit
// haze would, so its sides never show as a hard cone
const BEAM_SHADER = new Shader(`
void mainImage(out vec4 c, vec2 uv)
{
    vec3 toEye = normalize(cameraPos - worldPos), n = normalize(worldNormal);
    float edge = pow(abs(dot(n, toEye)), 1.6);
    float along = clamp(length(worldPos - vec3(0, ${LANTERN_Y.toFixed(2)}, 0))/${BEAM_LENGTH.toFixed(1)}, 0., 1.);
    float fade = pow(1. - along, 1.8)*smoothstep(0., .02, along);
    c = vec4(vec3(1), edge*fade*.32);
}`);

function buildBeams()
{
    const mesh = buildLathe([[BEAM_RADIUS_START, 0], [BEAM_RADIUS_END, BEAM_LENGTH]], 32, true, false);
    for (let i = 0; i < 2; ++i)
    {
        const beam = new EngineObject3D(vec3(0, LANTERN_Y, 0), mesh, undefined, BEAM_COLOR);
        beam.shader = BEAM_SHADER;
        beam.additive = beam.transparent = true;
        beam.emissive = 1;
        beams.push(beam);
    }
}

// how squarely a beam faces the camera, 0 to 1: the lamp's glow swells as one sweeps across the lens
function beamStrength()
{
    const camera = render3D.camera.pos, dx = camera.x, dy = camera.y - LANTERN_Y, dz = camera.z;
    const d = Math.hypot(dx, dy, dz) || 1;
    let best = 0;
    for (const yaw of [beamYaw, beamYaw + PI])
        best = Math.max(best, (-Math.sin(yaw)*dx - Math.cos(yaw)*dz)/d);
    return smoothStep(percent(best, .93, 1));
}

// the lamp seen through the rain: a soft halo always, flaring wide as a beam sweeps across the lens
function drawLanternGlow()
{
    render3D.additive = true;
    const size = 9 + 30*lanternGlow;
    render3D.drawBillboard(vec3(0, LANTERN_Y, 0), vec2(size), glowTile, rgb(1,.85,.6,.35 + .5*lanternGlow));
    render3D.additive = false;
}

function updateBeams()
{
    beamYaw = beamYawAt(stormTime);
    // laid on its side along -Z, then turned to face its way
    beams.forEach((beam, i) => beam.rotation3D = vec3(-PI/2, beamYaw + i*PI, 0));
    lanternGlow = beamStrength();
}

// the rain: thin streaks, lit, so the lightning brightens them, and brighter still inside the beam
class Rain extends InstancedMesh3D
{
    constructor()
    {
        super(buildBox(vec3(.06, 1.4, .06)), RAIN_MAX, undefined, rgb(.75,.8,.95,.25));
        this.transparent = true;
        this.radius = 1e4;
        // half its own pale color, half lit, so a streak never goes gray against the sky and still flares with a strike
        this.emissive = .5;
        const n = RAIN_MAX;
        this.x = new Float32Array(n), this.y = new Float32Array(n), this.z = new Float32Array(n);
        this.rx = new Float32Array(n), this.ry = new Float32Array(n), this.rz = new Float32Array(n);
        this.inBeam = new Uint8Array(n);
        this.scale = new Float32Array(n).fill(1);
        // spread through the box with a fixed seed, so recordings match
        let s = 12345;
        const random = () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return (s >>> 0)/4294967296; };
        for (let i = 0; i < n; ++i)
        {
            this.x[i] = (random() - .5)*RAIN_BOX;
            this.y[i] = RAIN_BOTTOM + random()*(RAIN_TOP - RAIN_BOTTOM);
            this.z[i] = (random() - .5)*RAIN_BOX + 60;
        }
        // leaning with the wind: tipped forward along it by the angle its sideways drift makes with its fall
        const lean = Math.atan2(RAIN_WIND, RAIN_SPEED);
        this.rx.fill(lean*-WIND_DIR[1]);
        this.rz.fill(lean*-WIND_DIR[0]);
    }

    step(dt)
    {
        // all of them fall, the first count of them draw, so more rain starts already spread through the box
        this.count = Math.round(RAIN_COUNT*(cinematic ? cineRainRate(stormTime) : 1));
        const camera = render3D.camera.pos, inside = rgb(.95,.93,.85,.5), outside = rgb(.75,.8,.95,.22);
        for (let i = 0; i < RAIN_MAX; ++i)
        {
            const p = rainStep(this.x[i], this.y[i], this.z[i], dt, camera.x, camera.z);
            this.x[i] = p.x, this.y[i] = p.y, this.z[i] = p.z;
            this.scale[i] = (p.x - camera.x)**2 + (p.y - camera.y)**2 + (p.z - camera.z)**2 < RAIN_CLEAR*RAIN_CLEAR ? 0 : 1;
            const lit = insideBeamMath(p.x, p.y, p.z, beamYaw) || insideBeamMath(p.x, p.y, p.z, beamYaw + PI) ? 1 : 0;
            if (lit !== this.inBeam[i])
                this.inBeam[i] = lit, this.setColorAt(i, lit ? inside : outside);
        }
        this.setTransforms(0, RAIN_MAX, this.x, this.y, this.z, this.rx, this.ry, this.rz, this.scale, this.scale, this.scale);
    }
}

// spray on the windward rocks: each time a swell climbs past one, it bursts up the rock's face and over it downwind,
// a sheet of droplets streaking as they fall, a cloud of spray the wind carries off, and foam churning at its foot.
// The wind is the particles' share of the world's gravity, set sideways, as nothing else here has a mass
const SPRAY_LEAN = .5; // how far a burst leans downwind
let sprayRocks = [];
function buildSpray()
{
    render3D.gravity = vec3(WIND_DIR[0]*.0016, 0, WIND_DIR[1]*.0016);
    sprayRocks = islandSprayPoints(WIND_DIR[0], WIND_DIR[1]).map((p, i) =>
        ({level: .3 + .13*(i*3 % 5), last: 0, lastBurst: -9, face: vec3(p.x, 0, p.z)}));
}

function sprayBurst(spray, rise)
{
    const k = clamp(rise/1.6, .6, 1.5), at = vec3(spray.face.x, spray.level, spray.face.z);
    const lean = vec3(SPRAY_LEAN, Math.atan2(WIND_DIR[0], WIND_DIR[1]), 0), clear = rgb(.9,.95,1,0);
    const emit = (tile, size, seconds, rate, cone, colorA, colorB, life, size0, size1, speed, damping, gravity) =>
    {
        const e = new ParticleEmitter3D(at, size, seconds, rate, cone, tile, colorA, colorB, clear, clear,
            life, size0, size1, speed, damping, gravity, .3, .4);
        e.rotation3D = lean;
        e.emissive = .35;
        return e;
    };
    const white = rgb(1,1,1,.95), blue = rgb(.85,.92,1,.9);
    // the body of white water climbing the rock, torn sheets turning as they go over
    const body = emit(sprayTiles[randInt(4)], vec3(2.5, .4, 2.5), .12, 150*k, PI/7, rgb(.85,.9,1,.5), rgb(.75,.82,.95,.4), 1, 1.6*k, 5.5*k, .2*k, .975, -.0055);
    body.angleSpeed = .03, body.gravityScale = .6, body.emissive = .12;
    // drops flung clear of it, streaking as they fall, fine ones and a few heavy
    const sheet = emit(puffTile, vec3(3, .5, 3), .14, 1100*k, PI/6, white, blue, 1.4, .5, .28, .32*k, .99, -.008);
    sheet.trailTime = .05, sheet.gravityScale = .5;
    const heavy = emit(puffTile, vec3(2, .5, 2), .1, 250*k, PI/5, white, blue, 1.6, 1, .6, .26*k, .992, -.008);
    heavy.trailTime = .07, heavy.gravityScale = .3;
    // the spray the wind carries off, and the foam churning at the rock's foot
    const mist = emit(sprayTiles[randInt(4)], 3, .2, 55*k, PI/3, rgb(.9,.93,1,.22), rgb(.8,.86,1,.16), 2.6, 3.5*k, 12*k, .1*k, .965, .0005);
    mist.angleSpeed = .008, mist.gravityScale = 1, mist.emissive = .15;
    const foam = emit(sprayTiles[randInt(4)], vec3(4, .3, 4), .15, 60*k, PI/2.2, rgb(.85,.9,1,.5), rgb(.75,.82,.95,.4), 1.4, 2, 5, .05, .95, -.002);
    foam.gravityScale = .3, foam.emissive = .12;
    soundStarted && crashSound.play(undefined, .22*k, rand(.8, 1.25));
}

function updateSpray()
{
    // engine time, as the sea shader's waves run on it
    for (const spray of sprayRocks)
    {
        const h = seaHeightAt(spray.face.x, spray.face.z, time), rise = (h - spray.last)*60;
        if (h > spray.level && spray.last <= spray.level && rise > .3 && time - spray.lastBurst > 1.2)
            sprayBurst(spray, rise), spray.lastBurst = time;
        spray.last = h;
    }
}

///////////////////////////////////////////////////////////////////////////////
// CLICK BEGIN - where a click calls the lightning down, plain math only so node can test it
//
// The click's ray from the camera picks the strike: the lighthouse itself if it passes through the tower, the rocks
// if it meets the islet, the sea where it comes down to the water, the cloud base where it goes up into it, and far
// out on the sea if it does neither within reach, so every click strikes somewhere.

const STRIKE_REACH = 400;   // meters across the sea a click can reach
const TOWER_RADIUS = 2.6, MOUND_RADIUS = 11;

function resolveStrike(ox, oy, oz, dx, dy, dz)
{
    // where the ray first meets a vertical cylinder round the island's middle, between two heights
    const cylinder = (radius, bottom, top) =>
    {
        const a = dx*dx + dz*dz, b = 2*(ox*dx + oz*dz), c = ox*ox + oz*oz - radius*radius;
        const disc = b*b - 4*a*c;
        if (a < 1e-12 || disc < 0) return;
        for (const t of [(-b - Math.sqrt(disc))/(2*a), (-b + Math.sqrt(disc))/(2*a)])
            if (t > 0 && oy + dy*t >= bottom && oy + dy*t <= top) return t;
    };
    const at = (t, kind) => ({kind, x: ox + dx*t, y: Math.max(0, oy + dy*t), z: oz + dz*t});

    const tower = cylinder(TOWER_RADIUS, SHELF_Y, TOWER_HEIGHT);
    const mound = cylinder(MOUND_RADIUS, -1, SHELF_Y);
    if (tower !== undefined && (mound === undefined || tower < mound))
        return {kind: 'tower', x: 0, y: TOWER_HEIGHT, z: 0};
    if (mound !== undefined)
        return at(mound, 'ground');
    if (dy < 0)
    {
        const t = -oy/dy, reach = Math.hypot(dx, dz)*t;
        if (reach <= STRIKE_REACH)
            return at(t, 'ground');
    }
    else if (dy > 0)
    {
        const t = (CLOUD_BASE_Y - oy)/dy;
        if (Math.hypot(dx, dz)*t <= STRIKE_REACH)
            return {kind: 'cloud', x: ox + dx*t, y: CLOUD_BASE_Y, z: oz + dz*t};
    }
    // toward the horizon: down to the sea as far out as a click reaches, in the direction clicked
    const h = Math.hypot(dx, dz);
    if (h < 1e-9) return {kind: 'ground', x: ox, y: 0, z: oz};
    return {kind: 'ground', x: ox + dx/h*STRIKE_REACH*.75, y: 0, z: oz + dz/h*STRIKE_REACH*.75};
}
// a resolved strike's final place: on the sea it meets the swell under it, read with the engine's time as the
// shader's waves are, so the bolt's foot never hides inside a crest; up in the layer for a cloud strike
function strikeTarget(kind, x, y, z, t)
{
    if (kind == 'cloud') return {x, y: CLOUD_BASE_Y + 8, z};
    if (kind == 'ground' && y <= 0) return {x, y: seaHeightAt(x, z, t), z};
    return {x, y, z};
}
// CLICK END

// a click: lightning where it points, the cloud kind up in the layer like the scheduled ones
function clickStrike()
{
    const ray = render3D.screenToRay(mousePosScreen), o = ray.origin, d = ray.direction;
    const s = resolveStrike(o.x, o.y, o.z, d.x, d.y, d.z), p = strikeTarget(s.kind, s.x, s.y, s.z, time);
    startStrike(s.kind == 'cloud' ? 'cloud' : 'ground', vec3(p.x, p.y, p.z), s.kind == 'tower');
}

///////////////////////////////////////////////////////////////////////////////
// SOUND BEGIN - the thunder's sound and its wait after the flash, plain math only so node can test it and the
// soundtrack tool can use the same thunder
//
// Thunder is two things. The crack is the bolt itself heard straight: one hard snap and a scatter of smaller
// snaps after it, uneven, over in half a second. The roll is that same sound come back from the whole sky and sea,
// so smeared it is one long rumble: noise that starts bright and darkens as it dies away, swelling and sinking
// unevenly as peals do. Neither has any steady beat or any echo that repeats, which is what makes a made thunder
// sound like a machine.

const SOUND_RATE = 44100;   // samples a second

// noise in -1 to 1, the same run for the same seed
function soundNoise(seed)
{
    let s = (seed*2654435761 >>> 0) || 1;
    return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return (s >>> 0)/2147483648 - 1; };
}

// scale a sound to full loudness, then press its loud parts down, so its quiet parts stand nearer to them
function soundFinish(data, drive)
{
    let peak = 1e-9;
    for (const v of data) peak = Math.max(peak, Math.abs(v));
    const full = Math.tanh(drive);
    for (let i = 0; i < data.length; ++i) data[i] = Math.tanh(data[i]/peak*drive)/full*.98;
    return data;
}

// no two strikes sound alike: the seed decides how the crack breaks up, whether it is one snap or two close
// together, how long it rings and how bright it is
function thunderCrack(seed)
{
    const white = soundNoise(seed), random = soundNoise(seed + 77), n = SOUND_RATE*.9 | 0, out = new Float32Array(n);
    const chance = () => (random() + 1)/2;
    // the snap, and after it a scatter of lesser ones at uneven times, thinning out and weakening
    const snaps = [{t: 0, gain: 1.6, fall: .005}, {t: 0, gain: 1, fall: .04 + .16*chance()}];
    if (chance() < .6) // a second stroke down the same channel, hard on the first, and sometimes a third
        for (let t = .07 + .2*chance(), k = chance() < .35 ? 2 : 1; k--; t += .08 + .15*chance())
        {
            const gain = .5 + .4*chance();
            snaps.push({t, gain: gain*1.4, fall: .005}, {t, gain, fall: .04 + .1*chance()});
        }
    const spread = .015 + .06*chance(), ring = .1 + .3*chance();
    for (let t = .02; t < .55; t += .012 + chance()*2*spread)
        snaps.push({t, gain: (.25 + .6*chance())*Math.exp(-t/ring), fall: .006 + .024*chance()});
    // everything low taken out, so it is a crack and not a thud, and all the top left in for its edge
    const bottom = 1 - Math.exp(-2*Math.PI*(180 + 200*chance())/SOUND_RATE), weight = 4 + 4*chance();
    let under = 0;
    for (let i = 0; i < n; ++i)
    {
        const t = i/SOUND_RATE, v = white();
        let loud = 0;
        for (const k of snaps) t >= k.t && (loud += k.gain*Math.exp(-(t - k.t)/k.fall));
        under += bottom*(v - under);
        // the edge, and with the first snap a thump from what was taken out, the weight of a strike close by
        out[i] = (v - under)*loud + under*weight*Math.exp(-t/.07);
    }
    return soundFinish(out, 4);
}

// the roll: one long rumble after the crack, the same sound smeared out by all the sky and sea it has crossed. It
// is not an echo, nothing comes back: it only fades, bright at first and darkening, and as it fades it grumbles,
// its loudness shaking unevenly many times a second, the way a rumble does and a hiss does not. It keeps to the
// middle of the hearing range, where small speakers can still carry it, with a deep body under it for big ones
function thunderRoll(seed)
{
    const white = soundNoise(seed + 13), random = soundNoise(seed + 200), seconds = 8, n = SOUND_RATE*seconds | 0;
    const out = new Float32Array(n), chance = () => (random() + 1)/2;
    // the grumble: a new random loudness about a dozen times a second, eased between, never a steady beat
    const rate = 9 + 6*chance(), shake = Array.from({length: seconds*16 + 2}, chance);
    const life = 1.5 + .8*chance(), dark = .45 + .4*chance(), floor = 300 + 150*chance();
    const bottom = 1 - Math.exp(-2*Math.PI*30/SOUND_RATE), deep = 1 - Math.exp(-2*Math.PI*75/SOUND_RATE);
    let pass = 0, pass2 = 0, under = 0, low = 0, low2 = 0;
    for (let i = 0; i < n; ++i)
    {
        const t = i/SOUND_RATE, v = white(), p = t*rate, k = p | 0, e = p - k;
        const grumble = .3 + .7*(shake[k] + (shake[k+1] - shake[k])*e*e*(3 - 2*e));
        const cut = floor + 2300*Math.exp(-t/dark), a = 1 - Math.exp(-2*Math.PI*cut/SOUND_RATE);
        pass += a*(v - pass), pass2 += a*(pass - pass2), under += bottom*(pass2 - under);
        low += deep*(v - low), low2 += deep*(low - low2);
        // darker noise is quieter noise, so it is lifted to keep the rumble's weight as the hiss goes
        const fade = Math.min(1, t/.03)*Math.min(1, (seconds - t)/.8);
        out[i] = fade*grumble*((pass2 - under)*Math.exp(-t/life)*((floor + 2300)/cut)**.3 + low2*7*Math.exp(-t/2.5));
    }
    return soundFinish(out, 2.5);
}

// how long after its flash a strike is heard, seconds for its distance in meters: sound takes its time, a little
// more than its true third of a second a hundred meters here, so a strike keeps the beat between light and sound
function thunderDelay(distance)
{
    return Math.min(.2 + distance/230, 1.6);
}

// how loud a strike is from a distance: thunder close by is a blow and far off a mutter. The crack fades fastest,
// since it is the sound come straight, and the roll carries, so a far strike is nearly all roll
function thunderLoudness(distance)
{
    const near = 1/(1 + (distance/100)**2);
    return {crack: near**1.4, roll: near**.75};
}
// SOUND END

// the storm's sound, all of it worked out here from noise and handed to the engine as sounds, no files: the rain,
// the wind and the sea's surge as loops, the thunder above, a few different cracks and rolls, and the crash of a
// swell on rock. A browser only lets sound start after a click or a key, so it does
let soundStarted = false, rainSound, seaSound, crackSounds = [], rollSounds = [], crashSound, rainPlaying;
const thunderDue = [];
let lastCrack = 0, lastRoll = 0;

function buildSounds()
{
    const white = soundNoise(99);
    // noise with only what lies between two frequencies left in, shaped over its length by a loudness curve
    const band = (seconds, low, high, shape) =>
    {
        const n = seconds*SOUND_RATE | 0, out = new Float32Array(n);
        const a = 1 - Math.exp(-2*PI*high/SOUND_RATE), b = 1 - Math.exp(-2*PI*low/SOUND_RATE);
        let pass = 0, pass2 = 0, under = 0, peak = 0;
        for (let i = 0; i < n; ++i)
        {
            pass += a*(white() - pass), pass2 += a*(pass - pass2), under += b*(pass2 - under);
            out[i] = (pass2 - under)*shape(i/SOUND_RATE);
            peak = Math.max(peak, Math.abs(out[i]));
        }
        for (let i = 0; i < n; ++i) out[i] /= peak;
        return out;
    };
    // a loop: the last stretch faded into the first, so it goes round with no seam
    const loop = (data, blend) =>
    {
        const m = blend*SOUND_RATE | 0, n = data.length - m;
        for (let i = 0; i < m; ++i) data[i] = data[i]*i/m + data[n + i]*(1 - i/m);
        return data.subarray(0, n);
    };
    const sound = (data, loudness) =>
    {
        const made = new Sound;
        made.sampleRate = SOUND_RATE;
        made.sampleChannels = [data.map(v => v*loudness)];
        return made;
    };
    rainSound = sound(loop(band(6.5, 1200, 9000, () => 1), .5), .5);
    // the wind, and under it the sea surging on the long swell's period, two swells a loop
    const swell = 2*PI/(WAVES[0].k*WAVES[0].speed);
    seaSound = sound(loop(band(swell*2 + .5, 40, 600, t => .45 + .55*(.5 + .5*Math.sin(2*PI*t/swell))**3), .5), .6);
    for (let seed = 1; seed <= 7; ++seed)
        crackSounds.push(sound(thunderCrack(seed), 1)), rollSounds.push(sound(thunderRoll(seed), 1));
    crashSound = sound(band(1.8, 300, 4500, t => Math.min(1, t/.07)*Math.exp(-t/.4)), .5);
}

// a strike's thunder, heard when its sound has crossed the sea to the camera: up in the cloud mostly boom, down
// to the sea a hard crack first, the big one louder, all of it fainter from further off
function queueThunder(kind, pos, big)
{
    if (recordMode) return;
    const distance = render3D.camera.pos.distance(pos), loud = thunderLoudness(distance), size = big ? 1.4 : .75;
    thunderDue.push({at: time + thunderDelay(distance), crack: loud.crack*(kind == 'cloud' ? .5 : 1)*size*4.5, roll: loud.roll*size*2.2});
}

function updateSound()
{
    if (recordMode) return;
