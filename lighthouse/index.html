    if (!soundStarted && (mouseWasPressed(0) || keyWasPressed('Space') || keyWasPressed('KeyF') || keyWasPressed('KeyR')))
    {
        soundStarted = true;
        rainPlaying = rainSound.playLoop(undefined, .5);
        seaSound.playLoop(undefined, .9);
    }
    // the thunder that is due, each a little different in pitch; what fell due before the sound began is let go
    for (const thunder of [...thunderDue])
    {
        if (thunder.at > time) continue;
        thunderDue.splice(thunderDue.indexOf(thunder), 1);
        if (!soundStarted) continue;
        if (thunder.crash) { crashSound.play(undefined, thunder.crash, rand(.6, .8)); continue; }
        // a different crack and roll from the last strike's, and each at its own pitch
        const pick = (sounds, last) => (last + 1 + randInt(sounds.length - 1)) % sounds.length;
        crackSounds[lastCrack = pick(crackSounds, lastCrack)].play(undefined, thunder.crack, rand(.8, 1.2));
        rollSounds[lastRoll = pick(rollSounds, lastRoll)].play(undefined, thunder.roll, rand(.8, 1.15));
    }
    cinematic && rainPlaying?.setVolume(.5*cineRainRate(stormTime));
}

const CAM_FOV = .9; // radians, a touch long so the tower doesn't lean
// free cam: F flies it (WASD, drag to look, Q/E down and up, Shift faster), meters a second and radians a pixel
const FREE_CAM_SPEED = 12, FREE_CAM_FAST = 40, FREE_CAM_TURN = .004;
const freeCamPos = vec3(), freeLook = {yaw: 0, pitch: 0};
let camYaw = 0; // which way the camera faces, 0 down -Z

function updateCamera()
{
    const camera = render3D.camera;
    if (freeCam)
    {
        const {yaw, pitch} = freeLook;
        camYaw = yaw;
        camera.pos = freeCamPos.copy();
        camera.lookAt(freeCamPos.add(vec3(-Math.sin(yaw)*Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw)*Math.cos(pitch))));
        return;
    }
    const {pos, target} = cameraPathAt(cinematic ? stormTime : stormTime % CAM_LOOP);
    camera.pos = pos;
    camera.lookAt(target);
    const look = target.subtract(pos);
    camYaw = Math.atan2(-look.x, -look.z);
}

function updateFreeCam()
{
    if (mouseIsDown(0))
    {
        freeLook.yaw -= mouseDeltaScreen.x*FREE_CAM_TURN;
        freeLook.pitch = clamp(freeLook.pitch - mouseDeltaScreen.y*FREE_CAM_TURN, -1.4, 1.4);
    }
    const {yaw, pitch} = freeLook, move = keyDirection();
    const speed = (keyIsDown('ShiftLeft') || keyIsDown('ShiftRight') ? FREE_CAM_FAST : FREE_CAM_SPEED)/60;
    const forward = vec3(-Math.sin(yaw)*Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw)*Math.cos(pitch));
    const right = vec3(Math.cos(yaw), 0, -Math.sin(yaw));
    const climb = (keyIsDown('KeyE') ? 1 : 0) - (keyIsDown('KeyQ') ? 1 : 0);
    const step = forward.scale(move.y).add(right.scale(move.x)).add(vec3(0, climb, 0)).scale(speed);
    freeCamPos.set(freeCamPos.x + step.x, Math.max(.5, freeCamPos.y + step.y), freeCamPos.z + step.z);
}

///////////////////////////////////////////////////////////////////////////////
function gameInit()
{
    new Render3DPlugin;
    render3D.sky = buildStormSky();
    render3D.setFog(FOG_START, FOG_END, FOG_COLOR);
    // the last of the light, low over the horizon band: a warm rim on the swells facing it
    render3D.sunDirection = vec3(Math.sin(SUN_AZIMUTH), .06, -Math.cos(SUN_AZIMUTH));
    render3D.sunColor = rgb(.54,.33,.21);
    render3D.ambientColor = AMBIENT_COLOR.copy();
    render3D.ambientGroundColor = rgb(.06,.08,.14);
    buildSea();
    buildClouds(); // first: its textures are the spray and the smoke too
    buildIsland();
    buildLighthouse();
    buildCottage();
    buildLightning();
    buildBeams();
    rain = new Rain;
    buildSpray();
    buildPost();
    recordMode || buildSounds();
    scheduleStrikes();
    render3D.camera.fov = CAM_FOV;
    render3D.camera.far = 2000;

    if (location.search.includes('title')) titleStart = time; // ?title shows the title card at load
    if (cinematic) titleStart = .5, hudVisible = false;
    updateCamera();
}

function gameUpdate()
{
    if (keyWasPressed('KeyH')) hudVisible = !hudVisible;
    if (keyWasPressed('KeyT')) titleStart = time;
    if (keyWasPressed('Space')) slowMo = !slowMo;
    if (keyWasPressed('KeyF'))
    {
        // into free cam where the camera is, or back onto the path
        freeCam = !freeCam;
        const camera = render3D.camera;
        freeCamPos.set(camera.pos.x, camera.pos.y, camera.pos.z);
        Object.assign(freeLook, {yaw: camYaw, pitch: 0});
    }
    if (keyWasPressed('KeyR')) { ++stormSeed; stormTime = 0; strikeCount = 0; clouds = cloudLayout(stormSeed); scheduleStrikes(); }
    if (freeCam) updateFreeCam();
    else if (mouseWasPressed(0)) clickStrike();
    stormTime += slowMo ? 1/240 : 1/60;
    updateCamera();
    updateLightning();
    updateBeams();
    rain.step(slowMo ? 1/240 : 1/60);
    updateSpray();
    updatePost();
    updateSound();
}

function gameUpdatePost() {}

///////////////////////////////////////////////////////////////////////////////
function gameRender() {}

function gameRenderPost()
{
    const now = performance.now();
    if (lastFrameTime)
        fpsSmooth = lerp(fpsSmooth, 1e3/Math.max(now - lastFrameTime, 1), .05);
    lastFrameTime = now;

    // title card on T: fades in over a second, holds three, fades out over two
    const titleAge = time - titleStart;
    if (titleAge < 6)
        drawCard(Math.min(titleAge, 1, (6 - titleAge)/2), 'Lighthouse', 'a storm at blue hour in LittleJS');

    // the cinematic's end card fades in and holds to the last frame
    if (cinematic && time > CINE_END_CARD)
        drawCard(Math.min(time - CINE_END_CARD, 1), 'LittleJS', 'The tiny fast JavaScript game engine');

    if (!hudVisible) return;
    const size = Math.round(mainCanvasSize.y/40), y = mainCanvasSize.y - size*1.4;
    if (freeCam)
        drawTextScreen('free cam:  WASD move   drag to look   Q/E down/up   Shift faster   F back', vec2(size, size*1.4),
            size*.8, rgb(1,1,1,.75), 0, BLACK, 'left');
    const text = (freeCam ? '' : 'click for lightning   ') + (recordMode ? '' : `${Math.round(fpsSmooth)} fps`);
    drawTextScreen(text, vec2(size, y), size, rgb(1,1,1,.75), 0, BLACK, 'left');
    drawTextScreen('LittleJS', vec2(mainCanvasSize.x - size, y), size, rgb(1,1,1,.75), 0, BLACK, 'right');
}

// big italic line with a smaller line under it, high in the sky
function drawCard(alpha, line1, line2)
{
    const size = mainCanvasSize.y/9, x = mainCanvasSize.x/2, y = mainCanvasSize.y*.2;
    const outline = rgb(.05,.05,.12,alpha*.35);
    drawTextScreen(line1, vec2(x, y), size, rgb(1,.95,.9,alpha*.9), size*.04, outline, 'center', 'Georgia, serif', 'italic');
    drawTextScreen(line2, vec2(x, y + size*.85), size*.3, rgb(1,.92,.85,alpha*.8), size*.02, outline, 'center', 'Georgia, serif');
}

///////////////////////////////////////////////////////////////////////////////
// ?record: the engine only steps when told to, so tools/capture.mjs can record frame exact video
const recordMode = location.search.includes('record');
let recordReady = false;
// tools/capture.mjs prints simTime with each shot
Object.defineProperty(window, 'simTime', {get: () => stormTime});
setEngineManualStep(recordMode);
engineInit(gameInit, gameUpdate, gameUpdatePost, gameRender, gameRenderPost).then(() => recordReady = true);
</script>
